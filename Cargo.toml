[package]
name = "rust-edlib"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native Rust bit-parallel Levenshtein alignment with Edlib semantics"
repository = "https://github.com/tmokveld/rust-edlib"
readme = "README.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[lib]
name = "rust_edlib"

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1

[workspace]
members = ["."]
