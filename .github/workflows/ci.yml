name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CC: "false"
      CXX: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked
      - run: cargo +1.85.0 test --locked --release

  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Martinsos/edlib
          ref: f8afceb49ab0095c852e0b8b488ae2c88e566afd # python-1.3.9
          path: target/edlib-upstream
          persist-credentials: false
      - name: Compare with upstream Edlib and the Rust baseline
        shell: bash
        env:
          EDLIB_SOURCE: ${{ github.workspace }}/target/edlib-upstream
          RUST_BASELINE: 09c70aef239d3e438c8e67d2ed4d2ed7cc174ab0
        run: |
          rustc +stable --version
          c++ --version
          echo '### Release benchmark' >> "$GITHUB_STEP_SUMMARY"
          sh tools/edlib-bench/run.sh --against "$RUST_BASELINE" --sample-size 10 \
            | tee -a "$GITHUB_STEP_SUMMARY"
