[package]
name = "edlib-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
rust-edlib = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
html_reports = ["criterion/html_reports", "criterion/plotters"]

[[bench]]
name = "compare"
harness = false

[build-dependencies]
cc = "1"

[profile.release]
codegen-units = 1
lto = "thin"

[workspace]
